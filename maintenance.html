<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Under Maintenance | Gamut Pro Sdn Bhd</title>
<meta name="description" content="Gamut Pro's website is temporarily down for maintenance. We'll be back shortly.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#132238">
<meta name="color-scheme" content="light">
<link rel="icon" href="Photos/GP%20horizontal.png">
<link rel="apple-touch-icon" href="Photos/GP%20horizontal.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#132238; --midnight:#0B1524; --gold:#C7A96B;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--navy);}
  .m-wrap{
    position:relative;overflow:hidden;background:linear-gradient(160deg,var(--navy) 0%,var(--midnight) 100%);color:#fff;
    min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
  }
  .m-wrap::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(199,169,107,.08) 1px,transparent 1px);background-size:34px 34px;
  }
  .m-glow{position:absolute;left:-8%;top:15%;width:min(620px,75vw);height:min(520px,65vh);border-radius:50%;background:radial-gradient(ellipse at 40% 40%,rgba(81,111,180,.32) 0%,rgba(199,169,107,.08) 45%,transparent 72%);pointer-events:none}
  .m-inner{position:relative;z-index:2;max-width:600px;padding:32px}
  .m-logo{height:34px;margin-bottom:44px;opacity:.92}
  .m-eyebrow{display:inline-flex;align-items:center;gap:8px;font:600 12px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:22px}
  .m-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .m-title{font-family:'Poppins',sans-serif;font-weight:600;font-size:clamp(26px,4.2vw,42px);line-height:1.15;color:#fff;margin:0 0 20px}
  .m-sub{font:400 17px/1.65 'Inter',sans-serif;color:rgba(255,255,255,.68);margin:0 0 40px}
  .m-contact{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 28px;padding-top:28px;border-top:1px solid rgba(255,255,255,.1);font:500 14px/1 'Inter',sans-serif;color:rgba(255,255,255,.55)}
  .m-contact span{color:rgba(255,255,255,.32);font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-right:2px}
  @media (max-width:600px){ .m-inner{padding:24px} }
</style>
</head>
<body>

<div class="m-wrap">
  <div class="m-glow" aria-hidden="true"></div>
  <div class="m-inner">
    <img class="m-logo" src="Photos/GP%20horizontal.png" alt="Gamut Pro" decoding="async" onerror="this.style.display='none'">
    <span class="m-eyebrow"><span class="m-dot" aria-hidden="true"></span>Temporarily Offline</span>
    <h1 class="m-title">We're making some improvements.</h1>
    <p class="m-sub">Our website is currently down for scheduled maintenance. We'll be back online shortly — thanks for your patience.</p>
    <div class="m-contact">
      <span>Reach us:</span>
      019-266 2291 &nbsp;·&nbsp; WhatsApp: wa.me/60192662291
    </div>
  </div>
</div>

</body>
</html>
